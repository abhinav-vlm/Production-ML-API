<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production ML API</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Iris Predictor</h1>
        <p>Production ML API</p>

        <form id="prediction-form">
            <input id="sepal_length" type="number" step="any" placeholder="Sepal length" required>
            <input id="sepal_width" type="number" step="any" placeholder="Sepal width" required>
            <input id="petal_length" type="number" step="any" placeholder="Petal length" required>
            <input id="petal_width" type="number" step="any" placeholder="Petal width" required>

            <button type="submit">Predict</button>
        </form>

        <section id="result">
            <p>Prediction: <span id="prediction">-</span></p>
            <p>Probability: <span id="probability">-</span></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
